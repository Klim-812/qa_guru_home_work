[pytest]
minversion = 8.4.1
# Флаги, которые применяются по умолчанию (например, -v для подробностей)
addopts = -v --alluredir=allure-results
# Ищем тесты в текущей папке
testpaths = .
# Если нужно, чтобы работали импорты внутри этой папки:
pythonpath = .
markers =
    smoke: Смоук тесты
    regression: Тесты для регрессионного тетсирования
